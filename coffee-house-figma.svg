<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="2640" viewBox="0 0 1440 2640">
<defs>
  <style>
    .sans{font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}
    .eyebrow{font:700 10px Arial,sans-serif;letter-spacing:2.2px;fill:#73543e}
    .body{font:14px Arial,sans-serif;fill:#81766c}
    .small{font:9px Arial,sans-serif;letter-spacing:1.6px;fill:#91857a}
    .heading{font:58px Georgia,serif;fill:#29231f;letter-spacing:-1.5px}
    .subhead{font:48px Georgia,serif;fill:#29231f;letter-spacing:-1px}
  </style>
  <clipPath id="heroClip"><rect x="735" y="220" width="565" height="500"/></clipPath>
  <clipPath id="menu1"><rect x="120" y="1430" width="365" height="250"/></clipPath>
  <clipPath id="menu2"><rect x="538" y="1430" width="365" height="250"/></clipPath>
  <clipPath id="menu3"><rect x="956" y="1430" width="365" height="250"/></clipPath>
  <clipPath id="interior"><rect x="120" y="1850" width="570" height="400"/></clipPath>
</defs>
<rect width="1440" height="2640" fill="#fffdf9"/>
<!-- header -->
<rect width="1440" height="88" fill="#fffdf9"/>
<rect x="120" y="27" width="34" height="34" fill="none" stroke="#73543e"/>
<text x="137" y="51" text-anchor="middle" class="serif" font-size="22" fill="#73543e">M</text>
<text x="168" y="49" class="sans" font-size="14" font-weight="700" letter-spacing="2" fill="#29231f">MAISON <tspan fill="#81766c" font-weight="400">COFFEE</tspan></text>
<g class="sans" font-size="12" fill="#625950"><text x="540" y="49">Our story</text><text x="660" y="49">Menu</text><text x="745" y="49">The space</text><text x="860" y="49">Contact</text></g>
<rect x="1110" y="20" width="210" height="48" fill="#29231f"/>
<text x="1135" y="49" class="sans" font-size="11" font-weight="600" fill="#fff">Explore menu</text><text x="1290" y="49" class="sans" font-size="14" fill="#fff">↗</text>
<!-- hero -->
<rect y="88" width="1440" height="760" fill="#f4efe7"/>
<text x="120" y="235" class="eyebrow">✳  YOUR DAILY MOMENT OF CALM</text>
<text x="120" y="345" class="heading">Good coffee.</text><text x="120" y="415" class="heading" font-style="italic" fill="#73543e">Better</text><text x="270" y="415" class="heading"> moments.</text>
<text x="120" y="480" class="body">A little pause in the middle of everything.</text><text x="120" y="506" class="body">Thoughtfully sourced coffee, slow mornings and</text><text x="120" y="532" class="body">a place that feels like yours.</text>
<rect x="120" y="580" width="205" height="50" fill="#29231f"/><text x="142" y="610" class="sans" font-size="11" fill="#fff">Discover our menu   ↗</text>
<text x="355" y="610" class="sans" font-size="11" font-weight="600" fill="#29231f">Our story  →</text>
<text x="120" y="715" font-size="28" fill="#73543e">✳</text><text x="160" y="704" class="sans" font-size="10" fill="#81766c">Specialty coffee</text><text x="160" y="722" class="sans" font-size="10" font-weight="700" fill="#29231f">made with intention</text>
<rect x="705" y="190" width="595" height="530" fill="none" stroke="#c7a985"/>
<image x="735" y="220" width="565" height="500" xlink:href="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" preserveAspectRatio="xMidYMid slice" clip-path="url(#heroClip)"/>
<circle cx="1280" cy="240" r="48" fill="#73543e"/><text x="1280" y="232" text-anchor="middle" class="sans" font-size="10" letter-spacing="1.5" fill="#fff">SLOW</text><text x="1280" y="247" text-anchor="middle" class="sans" font-size="10" letter-spacing="1.5" fill="#fff">DOWN</text><text x="1280" y="267" text-anchor="middle" font-size="17" fill="#fff">✳</text>
<text x="770" y="685" class="small" fill="#fff">01 / 04</text><text x="1110" y="685" class="small" fill="#fff">THE MAISON EXPERIENCE</text>
<text x="120" y="805" class="small">EST. 2021 — OSH, KYRGYZSTAN</text><text x="1120" y="805" class="small">SCROLL TO DISCOVER ↓</text>
<!-- intro -->
<text x="120" y="1005" class="eyebrow">A PLACE TO PAUSE</text>
<text x="500" y="1000" class="subhead">More than coffee.</text><text x="500" y="1060" class="subhead" font-style="italic" fill="#73543e">A feeling.</text>
<text x="500" y="1125" class="body">We believe the best things happen when you slow down.</text><text x="500" y="1152" class="body">Every cup is prepared with care, every detail has a purpose,</text><text x="500" y="1179" class="body">and every visit is an invitation to stay a little longer.</text>
<text x="500" y="1235" class="sans" font-size="12" font-weight="700" fill="#29231f">Get to know us  →</text>
<!-- menu -->
<rect y="1320" width="1440" height="610" fill="#f4efe7"/>
<text x="120" y="1400" class="eyebrow">MADE FOR YOUR MOMENT</text>
<text x="120" y="1470" class="subhead">Find your <tspan font-style="italic" fill="#73543e">favorite.</tspan></text>
<text x="1120" y="1460" class="sans" font-size="12" font-weight="700" fill="#29231f">View full menu  →</text>
<image x="120" y="1500" width="365" height="250" xlink:href="https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?auto=format&amp;fit=crop&amp;w=800&amp;q=85" preserveAspectRatio="xMidYMid slice" clip-path="url(#menu1)"/>
<image x="538" y="1500" width="365" height="250" xlink:href="https://images.unsplash.com/photo-1461988625982-7e46a099bf4f?auto=format&amp;fit=crop&amp;w=800&amp;q=85" preserveAspectRatio="xMidYMid slice" clip-path="url(#menu2)"/>
<image x="956" y="1500" width="365" height="250" xlink:href="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&amp;fit=crop&amp;w=800&amp;q=85" preserveAspectRatio="xMidYMid slice" clip-path="url(#menu3)"/>
<g fill="#fffdf9"><rect x="120" y="1750" width="365" height="100"/><rect x="538" y="1750" width="365" height="100"/><rect x="956" y="1750" width="365" height="100"/></g>
<g class="serif" font-size="21" fill="#29231f"><text x="142" y="1790">Classic espresso</text><text x="560" y="1790">Velvet cappuccino</text><text x="978" y="1790">Slow iced latte</text></g>
<g class="sans" font-size="11" fill="#81766c"><text x="142" y="1820">Rich, balanced, timeless.</text><text x="560" y="1820">Soft milk, bold character.</text><text x="978" y="1820">Cool, smooth, refreshing.</text></g>
<g class="sans" font-size="12" font-weight="700" fill="#73543e"><text x="425" y="1790">$3.50</text><text x="842" y="1790">$4.50</text><text x="1260" y="1790">$5.00</text></g>
<!-- feature -->
<image x="120" y="1990" width="570" height="400" xlink:href="https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" preserveAspectRatio="xMidYMid slice" clip-path="url(#interior)"/>
<rect x="138" y="1972" width="570" height="400" fill="none" stroke="#c7a985"/>
<text x="790" y="2070" class="eyebrow">YOUR CORNER OF THE CITY</text>
<text x="790" y="2150" class="subhead">Come as you are.</text><text x="790" y="2210" class="subhead" font-style="italic" fill="#73543e">Stay awhile.</text>
<text x="790" y="2270" class="body">Sunlight, warm wood, familiar faces and the kind</text><text x="790" y="2297" class="body">of coffee worth taking your time over. Whether</text><text x="790" y="2324" class="body">it's your first visit or your daily ritual, there's a</text><text x="790" y="2351" class="body">seat waiting for you.</text>
<rect x="790" y="2390" width="205" height="48" fill="none" stroke="#73543e"/><text x="812" y="2420" class="sans" font-size="11" fill="#73543e">Find your way here  ↗</text>
<!-- quote and footer -->
<rect y="2490" width="1440" height="150" fill="#29231f"/>
<text x="720" y="2540" text-anchor="middle" font-family="Georgia" font-size="45" fill="#c7a985">“</text>
<text x="720" y="2590" text-anchor="middle" font-family="Georgia" font-size="34" fill="#f4efe7">Life is too short for coffee in a hurry.</text>
</svg>